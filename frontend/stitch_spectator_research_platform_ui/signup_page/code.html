<body class="bg-background text-on-surface antialiased font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Signup Container -->
<main class="w-full max-w-[400px]">
<!-- Brand Logo -->
<div class="mb-gutter flex justify-center">
<img alt="Spectator Logotype" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPV3TEFh5nE2c0ozAU2uKlZzQEJDnwQCr5X2yhaQ1vPRVffEC4SNhk5rOpa8Wz5I7j00QNQIOGwNJEX2QZag0SAaWf9msdiQpkMJrCaVRbxIaKQYlW6w5Onokb81BE62OdsuVxBGZcasLd2kub9rmlz_S2pBj7HF3uOti4QXnBM9EEV0rZm5VhsrS1MGE_CjyTaarj4HMlG7EqoQPZ4tuSNrzs0p1UWE8zavfpWu62GM-ap5FHctQf"/>
</div>
<!-- Form Card -->
<div class="bg-[#17181B] border border-surface-variant rounded-lg p-gutter">
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Username Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="username">Username</label>
<input class="w-full bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 text-on-surface font-body-md text-body-md px-4 py-2 transition-colors duration-200" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Email</label>
<input class="w-full bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 text-on-surface font-body-md text-body-md px-4 py-2 transition-colors duration-200" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">Password</label>
<input class="w-full bg-surface border border-outline-variant rounded focus:border-primary focus:ring-0 text-on-surface font-body-md text-body-md px-4 py-2 transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-[#111417] font-label-sm text-label-sm py-3 px-4 rounded hover:opacity-80 transition-opacity duration-200 mt-2" type="submit">
                    Create account
                </button>
</form>
<!-- Login Link -->
<div class="mt-6 text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">
                    Already have an account? Log in
                </a>
</div>
</div>
</main>
